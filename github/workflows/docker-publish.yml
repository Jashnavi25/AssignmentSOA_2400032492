name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./software-training-backend
          file: ./software-training-backend/Dockerfile
          push: true
          tags: jashnavi25/docker-backend-2400032492:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./software-training-frontend
          file: ./software-training-frontend/frontend.Dockerfile
          push: true
          tags: jashnavi25/docker-frontend-2400032492:latest
